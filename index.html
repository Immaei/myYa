<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>myYa · ระบบร้านยา</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#121212;color:#fff;font:16px/1.6 'Noto Sans Thai',sans-serif}.wrap{max-width:780px;margin:auto;padding:32px 20px}header{display:flex;align-items:center;gap:16px;margin-bottom:30px}.mark{background:#1ed760;color:#111;padding:13px;border-radius:20px;font-size:27px}h1{margin:0;font-size:30px}p{color:#b3b3b3;margin:4px 0}.links{display:grid;gap:14px}a{display:flex;align-items:center;justify-content:space-between;gap:16px;text-decoration:none;color:inherit;background:#181818;border:1px solid #343434;border-radius:18px;min-height:90px;padding:20px;transition:.15s}a:hover{border-color:#1ed760;background:#202820;transform:translateY(-2px)}a:focus-visible{outline:3px solid #1ed760;outline-offset:3px}strong{font-size:19px}small{display:block;color:#b3b3b3;font-size:15px}.arrow{color:#1ed760;font-size:26px}.notice{margin-top:25px;background:#242014;border:1px solid #6d5622;padding:15px;border-radius:12px;color:#ffd891}</style></head><body><main class="wrap"><header><span class="mark" aria-hidden="true">✚</span><div><h1>myYa · ระบบร้านยา</h1><p>เลือกส่วนงานที่ต้องการใช้งาน</p></div></header><nav class="links" id="links" aria-label="เมนูหลัก"></nav><p class="notice">ข้อมูลทั้งหมดเป็นข้อมูลจำลอง ห้ามใส่ชื่อผู้ป่วยจริง</p></main><script>'use strict';const links=[{href:'pos.html',title:'หน้าขายยา',desc:'เลือกยา กรอกจำนวน บันทึกการจ่ายยา'},{href:'admin.html',title:'จัดการระบบ (ผู้ดูแล)',desc:'บัญชียา คลังรายล็อต รายการจ่าย ต้องใช้รหัสผู้ดูแล'},{href:'dashboard.html',title:'Dashboard คลังยา',desc:'ภาพรวมคลัง ล็อตใกล้หมดอายุ ยาต่ำกว่าจุดสั่งซื้อ'},{href:'status.html',title:'ตรวจสถานะระบบ',desc:'ตรวจว่าการเชื่อมต่อแต่ละส่วนทำงานปกติ'}];const root=document.querySelector('#links');for(const item of links){const a=document.createElement('a');a.href=item.href;const box=document.createElement('span'),t=document.createElement('strong'),d=document.createElement('small'),arrow=document.createElement('span');t.textContent=item.title;d.textContent=item.desc;arrow.textContent='→';arrow.className='arrow';arrow.setAttribute('aria-hidden','true');box.append(t,d);a.append(box,arrow);root.append(a)}</script></body></html>
