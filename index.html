<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>myYa · PharmaCloud</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#e7f6ff,#fff9ec 60%,#e6f6ff);color:#183b55;font:16px/1.65 'Noto Sans Thai',sans-serif}.wrap{max-width:1080px;margin:auto;padding:35px 22px 55px}
.hero{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:25px;background:linear-gradient(120deg,#d3efff,#f4fbff 65%,#fff2d8);border:1px solid #c7e8f8;border-radius:30px;padding:36px 42px;box-shadow:0 14px 40px #398ab018;margin-bottom:26px}
.eyebrow{color:#147faf;font-weight:700;letter-spacing:.04em;font-size:14px}h1{font-size:clamp(29px,4vw,44px);line-height:1.25;margin:8px 0}p{margin:4px 0;color:#5d7c90}.hero svg{width:210px;max-width:32%;flex-shrink:0}.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.link{display:flex;gap:15px;align-items:center;text-decoration:none;color:inherit;background:#fff;border:1px solid #d9ebf5;border-radius:23px;min-height:132px;padding:23px;box-shadow:0 8px 25px #3789ae12;transition:transform .18s,box-shadow .18s,border-color .18s}.link:hover{transform:translateY(-4px);border-color:#65bce7;box-shadow:0 14px 30px #3789ae25}.link:focus-visible{outline:3px solid #198fcb;outline-offset:3px}.symbol{display:grid;place-items:center;flex-shrink:0;width:60px;height:60px;border-radius:19px;background:#e2f4ff;font-size:29px}.content{flex:1;min-width:0}strong{display:block;font-size:19px}small{display:block;font-size:14px;color:#678296;margin-top:4px}.arrow{color:#168fc5;font-size:24px}.notice{margin-top:26px;padding:17px 20px;border:1px solid #f0d8a0;border-radius:17px;background:#fff8e9;color:#8c621d;font-size:15px}
@media(max-width:680px){.wrap{padding:17px 14px 35px}.hero{padding:26px 22px;border-radius:24px}.hero svg{width:110px;max-width:30%}.links{grid-template-columns:1fr}.link{min-height:94px;padding:17px}.symbol{width:52px;height:52px}strong{font-size:17px}}
</style></head><body><main class="wrap"><section class="hero"><div><div class="eyebrow">PHARMACLOUD · PHARMACY WORKSPACE</div><h1>myYa ระบบร้านยา 💙</h1><p>จัดการงานร้านยาในที่เดียว เลือกเมนูเพื่อเริ่มใช้งาน</p></div><svg viewBox="0 0 220 190" fill="none" aria-hidden="true"><rect x="68" y="35" width="99" height="139" rx="20" fill="#fff" stroke="#79bfe1" stroke-width="5"/><rect x="82" y="18" width="71" height="29" rx="8" fill="#3fa9db"/><rect x="86" y="77" width="64" height="68" rx="12" fill="#e4f5ff"/><path d="M118 92v37M99 110h38" stroke="#3fa9db" stroke-width="9" stroke-linecap="round"/><g transform="rotate(-35 48 124)"><rect x="13" y="105" width="70" height="35" rx="17.5" fill="#ffca6a"/><path d="M48 105h17a17.5 17.5 0 010 35H48z" fill="#fff" stroke="#ffca6a" stroke-width="2"/></g><circle cx="184" cy="61" r="13" fill="#ffde9b"/><circle cx="32" cy="50" r="9" fill="#8fd9e8"/></svg></section><nav id="links" class="links" aria-label="เมนูหลัก"></nav><p class="notice">🔒 ข้อมูลทั้งหมดเป็นข้อมูลจำลอง ห้ามใส่ชื่อผู้ป่วยจริง</p></main><script>
'use strict';
const links=[
{href:'pos.html',title:'หน้าขายยา',desc:'เลือกยา กรอกจำนวน บันทึกการจ่ายยา',icon:'💊'},
{href:'admin.html',title:'จัดการระบบ (ผู้ดูแล)',desc:'บัญชียา คลังรายล็อต รายการจ่าย ต้องใช้รหัสผู้ดูแล',icon:'🧑‍⚕️'},
{href:'dashboard.html',title:'Dashboard คลังยา',desc:'ภาพรวมคลัง ล็อตใกล้หมดอายุ ยาต่ำกว่าจุดสั่งซื้อ',icon:'📊'},
{href:'status.html',title:'ตรวจสถานะระบบ',desc:'ตรวจว่าการเชื่อมต่อแต่ละส่วนทำงานปกติ',icon:'🩺'}
];
const root=document.querySelector('#links');
for(const item of links){const a=document.createElement('a');a.href=item.href;a.className='link';const symbol=document.createElement('span');symbol.className='symbol';symbol.textContent=item.icon;symbol.setAttribute('aria-hidden','true');const content=document.createElement('span');content.className='content';const title=document.createElement('strong');title.textContent=item.title;const desc=document.createElement('small');desc.textContent=item.desc;content.append(title,desc);const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='→';arrow.setAttribute('aria-hidden','true');a.append(symbol,content,arrow);root.append(a)}
</script></body></html>
